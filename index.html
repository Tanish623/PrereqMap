
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrereqMap</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav>
        <h2>PrereqMap</h2>
        <a href="#">Home</a>
    </nav>

    <main>
        <section class="hero">
            <p class="tagline">YOUR LEARNING JOURNEY STARTS HERE</p>

            <h1>Learn anything.<br>Start with the basics.</h1>

            <p class="description">
                Discover the prerequisites you need to master
                any topic, one step at a time.
            </p>

            <div class="search-box">
                <input
                    type="text"
                    id="topicInput"
                    placeholder="What do you want to learn?"
                >
                

                <button id="exploreBtn">Explore topic</button>
            </div>

            

            <p id="message"></p>
            <p id="characterCount">Characters: 0</p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
